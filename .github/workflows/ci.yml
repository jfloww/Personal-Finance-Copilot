name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerdelta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/offerdelta_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Format and lint
        run: |
          uv run ruff format --check src tests annotate.py run_evaluation.py llm_smoke.py transactions.py validate_dataset.py
          uv run ruff check src tests annotate.py run_evaluation.py llm_smoke.py transactions.py validate_dataset.py

      - name: Type check
        run: uv run mypy

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
