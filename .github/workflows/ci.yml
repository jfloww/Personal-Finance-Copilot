name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: offerdelta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/offerdelta_test
      # An arbitrary, self-issued string with no external validity - the same
      # kind of thing TEST_DATABASE_URL above is, not the kind ANTHROPIC_API_KEY
      # is. There is nothing here to leak; it signs tokens for an ephemeral
      # service container that is gone at the end of the job.
      JWT_SECRET: ci-only-throwaway-signing-key-not-a-real-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Format and lint
        run: |
          uv run ruff format --check src tests analyse_failures.py annotate.py build_eval_subset.py build_public_results.py categorise.py llm_smoke.py review.py run_agent_evaluation.py run_operations_agent.py run_evaluation.py seed_demo.py sweep_threshold.py transactions.py users.py validate_dataset.py
          uv run ruff check src tests analyse_failures.py annotate.py build_eval_subset.py build_public_results.py categorise.py llm_smoke.py review.py run_agent_evaluation.py run_operations_agent.py run_evaluation.py seed_demo.py sweep_threshold.py transactions.py users.py validate_dataset.py

      - name: Type check
        run: uv run mypy

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: Migrate
        run: uv run alembic upgrade head
        env:
          CONNECTION_STRING: ${{ env.TEST_DATABASE_URL }}

      - name: Tests
        run: uv run pytest
