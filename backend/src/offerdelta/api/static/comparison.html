<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance Copilot — Offer Comparison</title>
<style>
  /* ── Palette ──────────────────────────────────────────────────────────
     Gain/loss hues validated for colour-vision deficiency rather than
     chosen by eye: blue↔orange separates under protanopia where the
     conventional green↔red pair collapses. Dark steps are their own
     values, not a flip of the light ones.                              */
  :root {
    --surface:      #f2f4f6;
    --panel:        #ffffff;
    --ink:          #12161a;
    --ink-2:        #47525d;
    --ink-3:        #78838e;
    --rule:         #dfe4e9;
    --rule-strong:  #c6ced6;
    --gain:         #0f6baf;
    --loss:         #b85a18;
    --assumed:      #6b4e9e;
    --gain-wash:    #0f6baf14;
    --loss-wash:    #b85a1814;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface:      #121517;
      --panel:        #191d20;
      --ink:          #e9edf0;
      --ink-2:        #a3aeb8;
      --ink-3:        #78838e;
      --rule:         #262c31;
      --rule-strong:  #39424a;
      --gain:         #3a8fd0;
      --loss:         #d4762e;
      --assumed:      #9070c4;
      --gain-wash:    #3a8fd01f;
      --loss-wash:    #d4762e1f;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 0 1.5rem 6rem;
    background: var(--surface);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 60rem; margin: 0 auto; }

  /* ── The ledger spine ─────────────────────────────────────────────────
     Every figure on the page lands in one right-aligned monospace column.
     Rows are grids sharing a template, so the eye reads a single spine
     down the whole document regardless of nesting depth.                */
  .row {
    display: grid;
    grid-template-columns: 1fr minmax(7.5rem, auto);
    align-items: baseline;
    gap: 0 1.25rem;
    padding: .45rem 0;
  }
  .num {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    text-align: right;
    white-space: nowrap;
    letter-spacing: -.01em;
  }
  .gain { color: var(--gain); }
  .loss { color: var(--loss); }

  /* ── Section furniture ───────────────────────────────────────────────
     Field labels, as on a form — these are sections of a document, not a
     numbered sequence, so no 01/02/03.                                  */
  .field-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .69rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding-bottom: .5rem;
    border-bottom: 1px solid var(--rule);
    margin: 3.5rem 0 1rem;
  }
  section:first-of-type .field-label { margin-top: 0; }

  /* ── Masthead ─────────────────────────────────────────────────────── */
  header { padding: 4rem 0 0; }
  .route {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .72rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .route b { color: var(--ink-2); font-weight: 500; }
  h1 {
    font-size: clamp(1.85rem, 5.2vw, 2.9rem);
    line-height: 1.08;
    letter-spacing: -.033em;
    font-weight: 620;
    margin: .7rem 0 0;
    max-width: 22ch;
  }
  .standfirst {
    color: var(--ink-2);
    max-width: 54ch;
    margin: 1rem 0 0;
  }

  /* ── Verdict ──────────────────────────────────────────────────────── */
  .verdict {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }
  .metric { background: var(--panel); padding: 1.15rem 1.25rem 1.25rem; }
  .metric .k {
    font-size: .74rem; color: var(--ink-3); letter-spacing: .02em;
    display: block; margin-bottom: .4rem;
  }
  .metric .v {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 1.5rem; font-weight: 600; letter-spacing: -.025em;
    display: block;
  }
  .metric .sub { font-size: .76rem; color: var(--ink-3); margin-top: .3rem; display: block; }

  /* ── Chart ────────────────────────────────────────────────────────── */
  .chart-wrap { position: relative; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 3px; padding: 1.25rem 1rem .5rem; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    transform: translate(-50%, -100%);
    background: var(--ink); color: var(--surface);
    padding: .35rem .55rem; border-radius: 3px; font-size: .74rem;
    font-family: ui-monospace, Menlo, monospace; white-space: nowrap;
    transition: opacity .1s linear;
  }
  .tip.on { opacity: 1; }

  /* ── Bars ─────────────────────────────────────────────────────────── */
  .bars { border: 1px solid var(--rule); border-radius: 3px;
    background: var(--panel); padding: .35rem 1.25rem; }
  .bar-row { display: grid; grid-template-columns: minmax(0,1fr) 8.5rem;
    align-items: center; gap: 0 1.25rem; padding: .5rem 0;
    border-bottom: 1px solid var(--rule); }
  .bar-row:last-child { border-bottom: 0; }
  .bar-track { position: relative; height: 1.45rem; display: flex; align-items: center; }
  .bar-label { position: absolute; left: 0; right: 0; padding: 0 .55rem;
    font-size: .84rem; z-index: 2; display: flex; align-items: center; gap: .45rem; }
  .bar-fill { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }

  /* ── Derivation ───────────────────────────────────────────────────── */
  .tree { border: 1px solid var(--rule); border-radius: 3px;
    background: var(--panel); padding: .35rem 1.25rem; }
  details > summary { list-style: none; cursor: pointer; border-radius: 2px; }
  details > summary::-webkit-details-marker { display: none; }
  summary:focus-visible { outline: 2px solid var(--gain); outline-offset: 2px; }
  .node > .row { border-bottom: 1px solid var(--rule); }
  .node:last-child > .row, .node:last-child > details > summary > .row { border-bottom: 0; }
  details > summary > .row { border-bottom: 1px solid var(--rule); }
  .kids { margin-left: 1.15rem; border-left: 1px solid var(--rule); padding-left: .9rem; }
  .name { min-width: 0; }
  .name b { font-weight: 550; }
  .twist { color: var(--ink-3); font-size: .62rem; width: .8rem;
    display: inline-block; transition: transform .12s ease; }
  details[open] > summary .twist { transform: rotate(90deg); }
  .formula {
    display: block; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .71rem; color: var(--ink-3); margin-top: .12rem;
    overflow-wrap: anywhere;
  }
  .badge {
    font-family: ui-monospace, Menlo, monospace;
    font-size: .6rem; letter-spacing: .06em; text-transform: uppercase;
    padding: .1rem .3rem; border-radius: 2px; white-space: nowrap;
    border: 1px solid currentColor; opacity: .85;
  }
  .b-ASSUMED { color: var(--assumed); }
  .b-USER_CONFIRMED { color: var(--gain); }
  .b-SOURCED { color: var(--gain); }
  .b-DERIVED { color: var(--ink-3); }

  /* ── Panels & notes ──────────────────────────────────────────────── */
  .panel { border: 1px solid var(--rule); border-radius: 3px;
    background: var(--panel); padding: 1.15rem 1.25rem; }
  .note { color: var(--ink-2); font-size: .87rem; margin: .5rem 0 0; }
  .flag {
    display: inline-flex; align-items: center; gap: .4rem;
    border: 1px solid var(--loss); color: var(--loss);
    background: var(--loss-wash);
    border-radius: 2px; padding: .3rem .5rem; font-size: .76rem; margin-top: .75rem;
  }
  .ok { color: var(--gain); }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: .55rem 0; border-bottom: 1px solid var(--rule); }
  ul.plain li:last-child { border-bottom: 0; }
  footer { margin-top: 4rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
    color: var(--ink-3); font-size: .8rem; }
  footer p { max-width: 68ch; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; }
  a { color: var(--gain); }

  .reveal { opacity: 0; transform: translateY(6px); animation: rise .5s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    .twist { transition: none; }
  }
  @media (max-width: 34rem) {
    .row { grid-template-columns: 1fr auto; }
    .bar-row { grid-template-columns: minmax(0,1fr) 6.5rem; }
  }
</style>
</head>
<body>
<main id="app">
  <header class="reveal">
    <p class="route">Loading…</p>
  </header>
</main>

<script>
"use strict";

/* Money arrives as an exact decimal string and is formatted by string
   surgery alone. JavaScript's only numeric type is an IEEE 754 double, so
   "4217.33" coerced to one is already an approximation, and the moment a
   subtotal is computed that way the page disagrees with the engine.

   No displayed amount is ever coerced. Pixel positions are a different
   matter — a chart is 720 units wide and cannot render a cent of error —
   so every coercion below is wrapped in geom() and marked GEOMETRY. A
   contract test enforces that marking, so an unannotated coercion fails
   the build rather than quietly reaching a figure someone reads. */
const geom = value => Number(value);   /* GEOMETRY: pixels, never display */
function fmt(amount, {sign = false, round = true} = {}) {
  const neg = amount.startsWith("-");
  let [whole, frac = ""] = (neg ? amount.slice(1) : amount).split(".");
  if (round) {
    const next = frac.charCodeAt(2) - 48;
    frac = frac.slice(0, 2);
    if (next >= 5) {
      const bumped = String(BigInt(whole + frac.padEnd(2, "0")) + 1n).padStart(3, "0");
      whole = bumped.slice(0, -2);
      frac = bumped.slice(-2);
    }
  }
  frac = (frac + "00").slice(0, 2);
  whole = whole.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const mark = neg ? "−" : (sign ? "+" : "");
  return mark + "$" + whole + "." + frac;
}
const isNeg = a => a.startsWith("-");
const cls = a => isNeg(a) ? "loss" : "gain";

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") n.className = v; else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null) n.setAttribute(k, v);
  return n;
};

function fieldLabel(text) { return el("p", {class: "field-label"}, text); }

function row(nameNode, amount, extra = "") {
  return el("div", {class: "row"},
    el("div", {class: "name"}, nameNode),
    el("div", {class: "num " + cls(amount)}, fmt(amount) + extra));
}

/* ── Cumulative delta chart ──────────────────────────────────────────
   Change over time on one series, so a line — no legend, the title names
   it. A zero rule is drawn because crossing it is the break-even the
   whole page is about. Values are compared as scaled BigInt cents, never
   as floats. */
function chart(series, moveMonth) {
  const cents = series.map(v => {
    const neg = v.startsWith("-");
    const [w, f = ""] = (neg ? v.slice(1) : v).split(".");
    const n = BigInt(w + (f + "00").slice(0, 2));
    return neg ? -n : n;
  });
  const nums = cents.map(geom);   /* GEOMETRY */
  const lo = Math.min(0, ...nums), hi = Math.max(0, ...nums);
  const W = 720, H = 220, PL = 8, PR = 8, PT = 14, PB = 26;
  const x = i => PL + (W - PL - PR) * (i / (series.length - 1));
  const y = v => PT + (H - PT - PB) * (1 - (v - lo) / ((hi - lo) || 1));

  const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": "Cumulative cash difference by month"});

  const zero = y(0);
  svg.append(s("line", {x1: PL, x2: W - PR, y1: zero, y2: zero,
    stroke: "var(--rule-strong)", "stroke-width": 1, "stroke-dasharray": "3 3"}));

  const area = s("path", {
    d: `M${x(0)},${zero} ` + nums.map((v,i)=>`L${x(i)},${y(v)}`).join(" ") +
       ` L${x(nums.length-1)},${zero} Z`,
    fill: "var(--gain-wash)"});
  svg.append(area);

  svg.append(s("path", {
    d: nums.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" "),
    fill: "none", stroke: "var(--gain)", "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round"}));

  nums.forEach((v, i) => {
    const marker = i === moveMonth - 1;
    svg.append(s("circle", {cx: x(i), cy: y(v), r: marker ? 5 : 3.5,
      fill: marker ? "var(--loss)" : "var(--gain)",
      stroke: "var(--panel)", "stroke-width": 2}));
  });

  [1, Math.ceil(series.length / 2), series.length].forEach(m => {
    const t = s("text", {x: x(m - 1), y: H - 8, "text-anchor": "middle",
      fill: "var(--ink-3)", "font-size": 11,
      "font-family": "ui-monospace, Menlo, monospace"});
    t.textContent = "M" + m;
    svg.append(t);
  });

  const wrap = el("div", {class: "chart-wrap"});
  const tip = el("div", {class: "tip"});
  wrap.append(svg, tip);

  const hit = s("rect", {x: 0, y: 0, width: W, height: H, fill: "transparent"});
  svg.append(hit);
  svg.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(series.length - 1,
      Math.round(((ev.clientX - box.left) / box.width * W - PL) / ((W - PL - PR) / (series.length - 1)))));
    tip.textContent = `M${i + 1}  ${fmt(series[i], {sign: true})}`;
    tip.style.left = (x(i) / W * box.width) + "px";
    tip.style.top = (y(nums[i]) / H * box.height - 8) + "px";
    tip.classList.add("on");
  });
  svg.addEventListener("pointerleave", () => tip.classList.remove("on"));
  return wrap;
}

/* ── Diverging bars for the component breakdown ───────────────────── */
function bars(components) {
  const shown = components.slice(0, 9);
  const mags = shown.map(c => Math.abs(geom(c.delta)));   /* GEOMETRY: bar widths */
  const max = Math.max(...mags, 1);
  const box = el("div", {class: "bars"});
  shown.forEach((c, i) => {
    const pct = (mags[i] / max) * 100;
    const fill = el("div", {class: "bar-fill",
      style: `${isNeg(c.delta) ? "right:50%" : "left:50%"};width:${pct / 2}%;` +
             `background:${isNeg(c.delta) ? "var(--loss-wash)" : "var(--gain-wash)"};` +
             `border-${isNeg(c.delta) ? "left" : "right"}:2px solid ` +
             `${isNeg(c.delta) ? "var(--loss)" : "var(--gain)"}`});
    box.append(el("div", {class: "bar-row"},
      el("div", {class: "bar-track"}, fill,
        el("div", {class: "bar-label"}, el("span", {}, c.label))),
      el("div", {class: "num " + cls(c.delta)}, fmt(c.delta, {sign: true}))));
  });
  return box;
}

/* ── Derivation tree — the signature ─────────────────────────────────
   Amounts stay in the same right-hand column at every depth, so the
   decomposition reads down one spine. */
function node(n, depth = 0) {
  const head = el("div", {class: "row"},
    el("div", {class: "name"},
      el("b", {}, (n.children.length ? el("span", {class: "twist"}, "▶") : ""), " ", n.label),
      el("span", {class: "badge b-" + n.evidence}, n.evidence.replace("_", " ")),
      el("span", {class: "formula"}, n.formula)),
    el("div", {class: "num " + cls(n.amount)}, fmt(n.amount)));

  if (!n.children.length) return el("div", {class: "node"}, head);

  const d = el("details", depth < 1 ? {open: "open"} : {});
  d.append(el("summary", {}, head));
  const kids = el("div", {class: "kids"});
  n.children.forEach(c => kids.append(node(c, depth + 1)));
  d.append(kids);
  return el("div", {class: "node"}, d);
}

function metric(k, v, sub, tone) {
  return el("div", {class: "metric"},
    el("span", {class: "k"}, k),
    el("span", {class: "v " + (tone || "")}, v),
    sub ? el("span", {class: "sub"}, sub) : null);
}

function render(d) {
  const app = document.getElementById("app");
  app.replaceChildren();

  const be = d.break_even;
  const eq = d.equivalent_salary;
  const moveMonth = 7;

  // The headline states what the data says, never a fixed conclusion. A page
  // that reads "the move pays" regardless of the number is worse than useless.
  const ahead = !isNeg(d.cash_delta);
  const headline = ahead
    ? "The move pays. Here is every dollar of why."
    : "The move costs you. Here is every dollar of where.";

  app.append(el("header", {class: "reveal"},
    el("p", {class: "route"}, el("b", {}, d.current_label), "  →  ", el("b", {}, d.candidate_label)),
    el("h1", {}, headline),
    el("p", {class: "standfirst"},
      `Over ${d.horizon_months} months, against your current job. Cash, wealth and time are ` +
      `kept apart — an offer that pays more while taking back weeks of your year in ` +
      `unpaid commuting is not simply better. Open any figure to see how it was built.`)));

  // Verdict
  const time = d.time_delta_hours;
  app.append(el("section", {class: "reveal", style: "animation-delay:.05s"},
    fieldLabel("Verdict"),
    el("div", {class: "verdict"},
      metric("Disposable cash", fmt(d.cash_delta, {sign: true}), `over ${d.horizon_months} months`, cls(d.cash_delta)),
      metric("Wealth", fmt(d.wealth_delta, {sign: true}), "vested equity and employer money", cls(d.wealth_delta)),
      metric("Commuting", (isNeg(time) ? "−" : "+") + time.replace("-", "") + " h",
        "per year, unpaid", isNeg(time) ? "gain" : "loss"),
      metric("Break-even",
        be.stable_break_even_month === null ? "Never" : "Month " + be.stable_break_even_month,
        be.first_crossing_month === be.stable_break_even_month
          ? "and it stays ahead" : "first crossed month " + be.first_crossing_month))));

  // Chart
  app.append(el("section", {class: "reveal", style: "animation-delay:.1s"},
    fieldLabel("Cumulative cash difference"),
    chart(d.cumulative_cash_delta, moveMonth),
    el("p", {class: "note"},
      `The drop at month ${moveMonth} is the move itself — deposit, broker fee, movers and ` +
      `furnishing all land together. The curve recovers by month ${moveMonth + 1}.`)));

  // Components
  app.append(el("section", {class: "reveal", style: "animation-delay:.15s"},
    fieldLabel("What moves the number"),
    bars(d.component_deltas),
    el("p", {class: "note"}, "Annualised. Positive means the offer wins that line.")));

  // Equivalent salary
  const eqBody = el("div", {class: "panel"});
  if (eq) {
    eqBody.append(
      el("div", {class: "row"},
        el("div", {class: "name"}, el("b", {}, "Salary that would match your current job"),
          el("span", {class: "formula"}, eq.target_metric + " · " + eq.tax_model +
            " · " + eq.iterations + " iterations")),
        el("div", {class: "num"}, fmt(eq.equivalent_salary))));
    if (eq.is_far_from_calibration) {
      eqBody.append(el("p", {class: "flag"},
        `Extrapolated ${eq.calibration_distance_percent}% from the one pay figure this ` +
        `model was calibrated on. Treat it as a direction, not a quote.`));
    }
  } else {
    eqBody.append(el("p", {class: "note"}, d.equivalent_salary_error || "No solution in range."));
  }
  app.append(el("section", {class: "reveal", style: "animation-delay:.2s"},
    fieldLabel("Equivalent salary"), eqBody));

  // Negotiation
  const neg = d.negotiation;
  const negBody = el("div", {class: "panel"});
  if (!neg) {
    negBody.append(el("p", {class: "note"}, d.negotiation_error || "Not available."));
  } else if (!neg.needs_negotiation) {
    negBody.append(
      el("p", {}, el("b", {class: "ok"}, "Nothing to negotiate."), " ",
        "The offer already clears your current job on first-year cash."),
      el("p", {class: "note"}, "Ask anyway, but the numbers do not require it."));
  } else {
    negBody.append(el("div", {class: "row"},
      el("div", {class: "name"}, el("b", {}, "Short by")),
      el("div", {class: "num loss"}, fmt(neg.gap))));
    const list = el("ul", {class: "plain"});
    neg.options.forEach(o => list.append(el("li", {},
      el("div", {class: "row"},
        el("div", {class: "name"},
          el("b", {}, o.lever.toLowerCase().replace(/_/g, " ")),
          el("span", {class: "formula"}, o.note)),
        el("div", {class: "num"},
          o.required_amount ? fmt(o.required_amount) :
          o.required_days ? o.required_days + " d" : "—")))));
    negBody.append(list);
  }
  app.append(el("section", {class: "reveal", style: "animation-delay:.25s"},
    fieldLabel("Closing the gap"), negBody));

  // Derivations
  [["Where the offer's money goes", d.candidate_derivation],
   ["Where your money goes today", d.current_derivation]].forEach(([title, tree], i) => {
    app.append(el("section", {class: "reveal", style: `animation-delay:${.3 + i * .05}s`},
      fieldLabel(title),
      el("div", {class: "tree"}, node(tree))));
  });

  app.append(el("footer", {class: "reveal", style: "animation-delay:.4s"},
    el("p", {},
      d.reconciled
        ? "Every projected month balances on both sides — the engine refuses to return a result that does not. "
        : "",
      "Amounts cross the API as exact decimal strings and are formatted here without ever being parsed as numbers."),
    el("p", {}, "Figures are placeholders, not real data. Portfolio project. Not tax, legal or financial advice.")));
}

fetch("/v1/demo/comparison")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(render)
  .catch(err => {
    document.getElementById("app").replaceChildren(
      el("header", {},
        el("h1", {}, "The comparison did not load."),
        el("p", {class: "standfirst"}, "Reload the page. If it keeps failing, the service is likely waking from sleep — give it thirty seconds."),
        el("p", {class: "formula"}, String(err))));
  });
</script>
</body>
</html>
