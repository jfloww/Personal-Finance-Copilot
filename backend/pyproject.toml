[project]
name = "offerdelta"
version = "0.1.0"
description = "MyFinSecretary: read-only transaction investigations with evidence and human-review proposals"
requires-python = ">=3.12"

# The domain layer stays standard-library only (blueprint section 10.1); the
# import-linter contract below enforces that these never reach it.
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "mcp>=2,<3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerdelta"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime
    "PIE",
    "PT",        # pytest style
    "RET",
    "SIM",
    "ARG",       # unused arguments
    "PL",        # pylint
    "RUF",
]
ignore = [
    "PLR0913",   # many arguments: financial models legitimately have many fields
]

[tool.ruff.lint.isort]
# `tests` is our own code, so it sorts with `offerdelta` rather than being
# mistaken for a third-party package.
known-first-party = ["offerdelta", "tests", "annotate", "categorise", "review", "run_agent_evaluation", "run_operations_agent", "seed_demo", "sweep_threshold", "transactions", "users"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "PLR2004",  # magic values are the point of a test
    "PLR0911",  # serialisation helpers dispatch on type; a return chain is clearest
]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "analyse_failures.py", "annotate.py", "build_eval_subset.py", "build_public_results.py", "categorise.py", "llm_smoke.py", "review.py", "run_agent_evaluation.py", "run_operations_agent.py", "run_evaluation.py", "seed_demo.py", "sweep_threshold.py", "transactions.py", "users.py", "validate_dataset.py"]

# Pydantic's BaseModel and BaseSettings carry explicit Any in their own
# signatures, and a wire or environment boundary deals in untyped input by
# nature. The relaxation stops at those edges: the domain, where exactness is
# the point, stays maximally strict.
[[tool.mypy.overrides]]
module = ["offerdelta.api.*", "offerdelta.config", "offerdelta.infrastructure.mcp.*"]
disallow_any_explicit = false

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "property: Hypothesis property-based tests",
]

# ---------------------------------------------------------------- import-linter

[tool.importlinter]
root_package = "offerdelta"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends on the standard library only"
type = "forbidden"
source_modules = ["offerdelta.domain"]
forbidden_modules = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "boto3",
    "botocore",
    "pyspark",
    "httpx",
    "requests",
]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "offerdelta.api",
    "offerdelta.application",
    "offerdelta.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Persistence does not depend on CSV ingest"
type = "forbidden"
source_modules = ["offerdelta.infrastructure"]
forbidden_modules = ["offerdelta.ingest"]

[[tool.importlinter.contracts]]
# The mirror of the contract above. `records` exists so neither side has to
# import the other to describe a transaction; without this, ingest could drift
# back into importing persistence and nothing would notice - which is exactly
# how the original coupling survived.
name = "CSV ingest does not depend on persistence"
type = "forbidden"
source_modules = ["offerdelta.ingest"]
forbidden_modules = ["offerdelta.infrastructure"]

[[tool.importlinter.contracts]]
# Routes reach data through use cases. A route that could construct a
# repository could construct one without a scope, and the scope is the only
# thing keeping one tenant out of another's rows.
#
# `allow_indirect_imports = "true"` is load-bearing, not decoration: a plain
# forbidden contract checks the whole chain, and `api -> application.auth ->
# repositories` is exactly the legitimate path this task built - the API is
# supposed to reach a repository through the application layer, only never on
# its own. Without this flag the contract is broken from the moment it is
# written, by the very code that is supposed to satisfy it.
name = "API does not reach repositories directly"
type = "forbidden"
source_modules = ["offerdelta.api"]
forbidden_modules = ["offerdelta.infrastructure.postgres.repositories"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Agent tools stay transport neutral"
type = "forbidden"
source_modules = ["offerdelta.agent.tools"]
forbidden_modules = [
    "anthropic",
    "mcp",
    "offerdelta.infrastructure",
    "offerdelta.api",
]
